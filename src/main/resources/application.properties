# =============================================
# Spring Boot
# =============================================
spring.application.name=users-management
server.port=${PORT:8080}

# DataSource y JavaMail se configuran manualmente con @Configuration
# Se excluye la auto-configuracion para evitar conflicto con las claves db.* y smtp.*
spring.autoconfigure.exclude[0]=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
spring.autoconfigure.exclude[1]=org.springframework.boot.autoconfigure.mail.MailSenderAutoConfiguration
spring.autoconfigure.exclude[2]=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# Crea la tabla users y el admin inicial al arrancar (schema.sql es idempotente)
spring.sql.init.mode=always

# =============================================
# Configuracion de Base de Datos PostgreSQL
# En Render se sobrescriben con las variables DB_HOST, DB_PORT, DB_NAME, DB_USERNAME y DB_PASSWORD
# =============================================
db.host=localhost
db.port=5432
db.name=crud_usuarios
db.username=postgres
db.password=postgres

# =============================================
# Configuracion SMTP (JavaMail)
# =============================================
smtp.host=smtp.gmail.com
smtp.port=587
smtp.username=tu_correo@gmail.com
smtp.password=tu_app_password_aqui
smtp.from.address=tu_correo@gmail.com
smtp.from.name=Gestion de Usuarios

# =============================================
# Seguridad JWT
# En produccion defina JWT_SECRET con al menos 32 bytes aleatorios codificados en Base64.
# =============================================
jwt.secret=${JWT_SECRET:ZGV2ZWxvcG1lbnQtb25seS1qd3Qtc2VjcmV0LW11c3QtYmUtcmVwbGFjZWQ=}
jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:900}

# =============================================
# Carga de archivos (foto de perfil)
# El dominio limita la imagen a 2 MB; el limite HTTP es algo mayor para
# responder un 400 con mensaje claro. Por encima de 3 MB se responde 413.
# =============================================
spring.servlet.multipart.max-file-size=3MB
spring.servlet.multipart.max-request-size=3MB
server.tomcat.max-swallow-size=10MB

# =============================================
# Guia 9 — Backblaze B2 (bucket privado, API compatible con S3)
# keyID = accessKeyId, applicationKey = secretAccessKey. Use una Application Key
# restringida al bucket (no la Master Key). Nunca escriba las claves aqui.
# =============================================
storage.b2.enabled=${B2_ENABLED:false}
storage.b2.endpoint=${B2_ENDPOINT:https://s3.us-east-005.backblazeb2.com}
storage.b2.region=${B2_REGION:us-east-005}
storage.b2.bucket=${B2_BUCKET:}
storage.b2.key-id=${B2_KEY_ID:}
storage.b2.application-key=${B2_APPLICATION_KEY:}

# =============================================
# Guia 10 — Cache distribuida Valkey (Aiven)
# VALKEY_URI = Service URI de Aiven: rediss://default:PASSWORD@HOST:PORT (TLS)
# El prefijo separa estas claves de las de otros servicios que usen la misma instancia.
# =============================================
cache.valkey.enabled=${VALKEY_ENABLED:false}
cache.valkey.uri=${VALKEY_URI:}
cache.valkey.key-prefix=${VALKEY_KEY_PREFIX:users-service}
cache.valkey.user-ttl-seconds=${VALKEY_USER_TTL_SECONDS:300}
cache.valkey.photo-ttl-seconds=${VALKEY_PHOTO_TTL_SECONDS:3600}
cache.valkey.timeout-millis=${VALKEY_TIMEOUT_MILLIS:2000}
cache.valkey.max-connections=${VALKEY_MAX_CONNECTIONS:8}

# =============================================
# Guia 11 — OpenSearch (Aiven)
# OPENSEARCH_URL = Service URI de la pestana "OpenSearch" (puerto del motor, no el 443 de Dashboards).
# Puede incluir las credenciales (https://avnadmin:PASSWORD@HOST:PORT) o definirlas aparte.
# =============================================
search.opensearch.enabled=${OPENSEARCH_ENABLED:false}
search.opensearch.url=${OPENSEARCH_URL:}
search.opensearch.username=${OPENSEARCH_USERNAME:}
search.opensearch.password=${OPENSEARCH_PASSWORD:}
search.opensearch.index=${OPENSEARCH_INDEX:users}
search.opensearch.timeout-millis=${OPENSEARCH_TIMEOUT_MILLIS:5000}
